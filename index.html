<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>InterCampus: A Student Knowledge & Action Network</title>
<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b141d;--card:#142230;--ink:#e6eef5;--mut:#93a8bb;--line:#26394b;--pri:#5cc0e0;--pri2:#10303f;--acc:#f2c24a;--on:#06222d;--ok:#5fd694;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#0b141d;--card:#142230;--ink:#e6eef5;--mut:#93a8bb;--line:#26394b;--pri:#5cc0e0;--pri2:#10303f;--acc:#f2c24a;--on:#06222d;--ok:#5fd694;--bad:#ff8a80}

body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}

header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--line);z-index:20}
.bar{max-width:1080px;margin:auto;padding:8px 16px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.logo{font:700 1.25rem Georgia,serif;color:var(--pri);margin-right:auto;cursor:pointer;background:none;border:0}
nav{display:flex;gap:2px;flex-wrap:wrap}nav button{background:none;border:0;color:var(--mut);padding:8px 10px;border-radius:6px;font:inherit;cursor:pointer}nav button.on{background:var(--pri2);color:var(--pri);font-weight:600}
main{max-width:1080px;margin:auto;padding:20px 16px 60px}
.btn{background:var(--pri);color:var(--on);border:0;border-radius:6px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}.btn.ghost{background:none;color:var(--pri);border:1px solid var(--pri)}.btn.sm{padding:4px 10px;font-size:.88rem}.btn.bad{background:var(--bad);color:var(--card)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}.grid .card{margin:0}
.m{color:var(--mut);font-size:.92rem}.chip{display:inline-block;background:var(--pri2);color:var(--pri);border-radius:99px;padding:1px 10px;font-size:.82rem;margin:0 4px 4px 0}.chip.v{background:var(--ok);color:var(--card)}.chip.w{background:var(--acc);color:#2b2000}.chip.b{background:var(--bad);color:var(--card)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.split{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.hero{padding:28px 0 12px;max-width:720px}.hero p{font-size:1.1rem;color:var(--mut)}
.note{border-left:4px solid var(--acc);background:var(--card);padding:10px 14px;border-radius:6px;margin:12px 0;font-size:.93rem}
input,select,textarea{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
label{display:block;margin:10px 0;font-size:.93rem;font-weight:600}label.ck{font-weight:400;display:flex;gap:8px}label.ck input{width:auto}

.ov{position:fixed;inset:0;background:#0009;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 14px 20px;overflow:auto}
.dlg{background:var(--card);border-radius:12px;padding:20px;width:100%;max-width:520px}
table{width:100%;border-collapse:collapse;font-size:.92rem}td,th{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}.sc{overflow-x:auto}
.stat{font:700 2rem Georgia,serif;color:var(--pri)}.th{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}.rep{margin-left:18px;padding-left:12px;border-left:3px solid var(--line)}
#t{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;display:none;max-width:90%}
@media (prefers-reduced-motion:no-preference){.ov{animation:f .15s}@keyframes f{from{opacity:0}}}
</style></head><body>
<header><div class="bar"><button class="logo" data-a="go" data-v="home">InterCampus</button><nav id="nav"></nav><span id="who"></span></div></header>
<main id="app"></main><div id="m"></div><div id="t" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const CFG={url:"https://ndhfeqynavziwpzkgmix.supabase.co",key:"sb_publishable_fPBttycFc8EYrsf3MYyKgQ_KduWImXH"};
const LIVE=!CFG.url.startsWith("YOUR"),sb=LIVE?supabase.createClient(CFG.url,CFG.key):null;
const U=["Bahria University","IBA Karachi","NED University","FAST-NUCES Karachi"];
const RULES=["Harassment or threats","Hate speech or discrimination","Private information shared","Copyright or unauthorised material","Leaked exam or answer key","Misinformation presented as fact","Impersonation or spam"];
const TK=["Objectives","Roles","Schedule","Budget","Venue","Permissions","Publicity","Contingency plan"],KN={verified:"Verified information",experience:"Personal experience",opinion:"Opinion"};
let UID=null,AU={};const S={me:null,v:"home",id:null,q:"",fu:"",ft:"",corr:[],res:[],iss:[],ev:[],rep:[],log:[],ver:[],raw:[],cnt:0};
const e=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),$=s=>document.querySelector(s),chips=a=>a.map(t=>`<span class="chip">${e(t)}</span>`).join(""),find=(a,i)=>S[a].find(x=>x.id==i),isMod=()=>S.me&&S.me.role=="mod"&&!S.me.suspended,kk=s=>s.startsWith("Verified")?"verified":s.startsWith("Personal")?"experience":"opinion";
function toast(x){const t=$("#t");t.textContent=x;t.style.display="block";clearTimeout(toast.i);toast.i=setTimeout(()=>t.style.display="none",4200)}
function ok(){if(!LIVE){toast("Add your Supabase keys to turn on accounts and data.");return 0}if(!S.me){toast("Log in or join to take part. Guests can read.");A.join();return 0}if(S.me.suspended){toast("Your account is suspended. Contact the moderators.");return 0}if(!S.me.verified){toast("Verification pending. Posting opens once a moderator approves you.");return 0}return 1}
async function add(kind,parent,data){const{data:r,error}=await sb.from("items").insert({kind,parent,data}).select("id").single();if(error){toast(error.code=="23505"?"You have already done that.":"Could not save: "+error.message);return 0}await load();return r.id}
async function upd(id,data){const{error}=await sb.from("items").update({data}).eq("id",id);if(error)toast(error.message);await load()}
async function tog(k,p){const m=S.raw.find(r=>r.kind==k&&r.parent==p&&r.owner==UID);if(m){await sb.from("items").delete().eq("id",m.id);await load()}else await add(k,p,{})}
async function load(){if(!LIVE)return render();
const[{data:r,error},{data:a}]=await Promise.all([sb.from("items").select("*").order("created_at").limit(5000),sb.from("authors").select("*")]);
if(error){toast("Cannot reach the database: "+error.message);return}
S.raw=r;AU=Object.fromEntries((a||[]).map(x=>[x.id,x]));
const by=(k,p)=>r.filter(x=>x.kind==k&&(p===undefined||x.parent==p)),n=o=>(AU[o]||{}).name||"Member",u=o=>(AU[o]||{}).uni||"",mine=l=>l.some(x=>x.owner==UID);
S.corr=by("corr").map(c=>{const th=by("th",c.id).map(t=>({id:t.id,...t.data,by:n(t.owner),u:u(t.owner),r:by("reply",t.id).map(x=>({...x.data,by:n(x.owner),u:u(x.owner)}))}));return{id:c.id,...c.data,unis:[...new Set([u(c.owner),...th.flatMap(t=>[t.u,...t.r.map(x=>x.u)])].filter(Boolean))],circ:by("circ",c.id).map(x=>{const j=by("jn",x.id);return{id:x.id,...x.data,n:j.length,j:mine(j)}}),th}});
S.res=by("res").map(x=>({id:x.id,own:x.owner,ver:1,...x.data,by:n(x.owner),uni:u(x.owner),date:x.created_at.slice(0,10),use:by("use",x.id).length}));
S.iss=by("iss").map(i=>{const c=by("camp",i.id)[0];return{id:i.id,...i.data,ev:by("evd",i.id).map(x=>x.data),pr:by("prop",i.id).map(p=>({id:p.id,...p.data,v:by("vote",p.id).length})),grp:by("grp",i.id).length,camp:c?c.data:null,st:c?"Campaign planned":by("meet",i.id).length?"Meeting requested":i.data.st}});
S.ev=by("ev").map(x=>{const g=by("rsvp",x.id);return{id:x.id,own:x.owner,...x.data,n:g.length,going:mine(g),off:by("offer",x.id).length}});
S.rep=by("report").map(x=>({id:x.id,...x.data}));S.log=by("log").map(x=>({id:x.id,...x.data}));render()}
async function boot(){if(!LIVE)return render();S.me=null;if(UID){const{data}=await sb.from("profiles").select("*").eq("id",UID).single();S.me=data}
const{data:c}=await sb.rpc("student_count");S.cnt=c||0;if(isMod()){const{data:v}=await sb.from("profiles").select("*").eq("verified",false);S.ver=v||[]}await load()}
if(LIVE)sb.auth.onAuthStateChange((ev,s)=>{UID=s&&s.user?s.user.id:null;setTimeout(()=>{boot();if(ev=="PASSWORD_RECOVERY")A.pw()},0)});
const fld=([n,l,t,o,v])=>t=="area"?`<label>${l}<textarea name="${n}" rows="3" required></textarea></label>`:t=="sel"?`<label>${l}<select name="${n}">${o.map(x=>`<option>${e(x)}</option>`).join("")}</select></label>`:t=="chk"?`<label class="ck"><input type="checkbox" name="${n}" ${v?"checked":""} ${o?"":"required"}> <span>${l}</span></label>`:`<label>${l}<input name="${n}" type="${t||"text"}" value="${e(v||"")}" ${t=="password"?'minlength="8" autocomplete="new-password"':""} ${o==="opt"?"":"required"}></label>`;
function modal(title,fs,id,btn,pre=""){$("#m").innerHTML=`<div class="ov" data-a="x"><form class="dlg" data-f="${id}"><h3>${title}</h3>${pre}${fs.map(fld).join("")}<div class="row"><button class="btn">${btn}</button><button type="button" class="btn ghost" data-a="x">Cancel</button></div></form></div>`}
const head=(t,p,b="")=>`<div class="split"><div><h2>${t}</h2><p class="m">${p}</p></div>${b}</div>`,
filt=(u,x="")=>`<div class="fl"><input id="q" data-s="q" placeholder="Search by title, course, topic or tag" value="${e(S.q)}" aria-label="Search"><select data-s="fu" aria-label="University"><option value="">All universities</option>${U.map(n=>`<option ${S.fu==n?"selected":""}>${n}</option>`).join("")}</select>${x}</div><div id="lst"></div>`,
back=v=>`<p><button class="btn ghost sm" data-a="go" data-v="${v}">Back to list</button></p>`,
st=()=>[[S.cnt,"verified students"],[4,"institutions"],[S.corr.length,"corridors"],[S.res.filter(r=>!r.hid).length,"resources"],[S.ev.length,"events"]];
const V={
home:()=>(LIVE?"":`<div class="note"><b>Not connected yet.</b> Open index.html and paste your Supabase URL and anon key at the top of the script (see the setup guide).</div>`)+`<section class="hero"><h1>Learn across campuses. Act together.</h1><p>InterCampus connects students at Karachi universities to exchange course knowledge, share study resources, discuss campus concerns and organise events, under a published community charter.</p><div class="row">${S.me?`<button class="btn" data-a="go" data-v="corr">Explore corridors</button>`:`<button class="btn" data-a="join">Join with your university email</button>`}<button class="btn ghost" data-a="go" data-v="charter">Read the charter</button></div></section>
<div class="grid" style="margin:22px 0">${[["Knowledge corridors","corr","Course and topic spaces shared by students at different universities."],["Resource library","lib","Searchable, moderated notes, guides and practice questions."],["Campus issues","iss","Document concerns, weigh proposals and organise peacefully."],["Events hub","ev","Listings, competitions and planning workspaces."]].map(([t,v,d])=>`<div class="card"><h3>${t}</h3><p class="m">${d}</p><button class="btn ghost sm" data-a="go" data-v="${v}">Open</button></div>`).join("")}</div>
<div class="card"><h3>Pilot institutions</h3><p>${chips(U)}</p><div class="row" style="gap:30px">${st().map(([n,l])=>`<div><div class="stat">${n}</div><div class="m">${l}</div></div>`).join("")}</div></div>
<div class="note">Guests can read public pages. Posting and group participation are reserved for verified students.</div>`,
corr:()=>S.id?cd():head("Knowledge corridors","Students on the same course or theme at different universities, learning together.",`<button class="btn" data-a="newCorr">New corridor</button>`)+filt(),
lib:()=>head("Academic resource library","Share only original or permitted material. No paid textbooks, leaked assessments or private information.",`<button class="btn" data-a="upl">Upload resource</button>`)+filt(0,`<select data-s="ft" aria-label="Type"><option value="">All types</option>${["Notes","Study guide","Practice questions","Summary","Open resource link"].map(n=>`<option ${S.ft==n?"selected":""}>${n}</option>`).join("")}</select>`),
iss:()=>S.id?id_():head("Campus issues and student voice","Map a concern, develop proposals, and organise lawful, peaceful action.",`<button class="btn" data-a="newIss">Document an issue</button>`)+`<div class="note">This is a space for student voice, not a replacement for formal grievance or emergency channels. Urgent safety concerns go to campus security or emergency services.</div>`+filt(),
ev:()=>S.id?ed():head("Events, programmes and competitions","Find activities across campuses or list your society’s own.",`<button class="btn" data-a="newEv">List an event</button>`)+filt(0,`<select data-s="ft" aria-label="Category"><option value="">All categories</option>${["Discussion","Competition","Workshop","Volunteer drive","Debate","Sports","Exhibition"].map(n=>`<option ${S.ft==n?"selected":""}>${n}</option>`).join("")}</select>`),
admin:()=>isMod()?adm():`<div class="card"><h2>Moderator dashboard</h2><p>Reserved for trained moderators.</p></div>`,
charter:()=>`<h2>Community charter</h2>`+[["Respectful dialogue","Disagreement is welcome. Discrimination, targeted harassment, threats and incitement are not. Separate personal accounts, allegations, evidence and confirmed facts."],["Peaceful, lawful organising","Campaigns must publish purpose, organisers, requested change, planned activity and safety arrangements. No intimidation, doxxing, vandalism or violence."],["Privacy","We collect only what is needed: your name, university and email. No student ID numbers are shown or stored. Never share private details or photos without consent. You can delete your account and all your content at any time from your profile."],["Academic integrity","Upload only what you created or may distribute. No leaked exams, sold work or plagiarism. Copyright reports lead to takedown."],["Moderation and appeals","Actions range from a reminder to suspension. You are told which rule applied and can appeal. No single university controls moderation."]].map(([t,d])=>`<div class="card"><h3>${t}</h3><p>${d}</p></div>`).join("")};
const LST={
corr:()=>{const q=S.q.toLowerCase();return `<div class="grid">${S.corr.filter(c=>(!S.fu||c.unis.includes(S.fu))&&(c.name+c.desc+c.th.map(t=>t.t+t.tag).join()).toLowerCase().includes(q)).map(c=>`<div class="card"><span class="chip w">${e(c.kind)}</span><h3>${e(c.name)}</h3><p class="m">${e(c.desc)}</p><p>${chips(c.unis)}</p><p class="m">${c.th.filter(t=>!t.hid).length} topics</p><button class="btn sm" data-a="go" data-v="corr" data-i="${c.id}">Open</button></div>`).join("")||"<p class=m>No corridors yet. Start the first one.</p>"}</div>`},
lib:()=>{const q=S.q.toLowerCase();return S.res.filter(r=>!r.hid&&(!S.fu||r.uni==S.fu)&&(!S.ft||r.type==S.ft)&&(r.t+r.course+r.desc+(r.tags||[]).join()).toLowerCase().includes(q)).reverse().map(r=>`<div class="card"><div class="split"><h3>${e(r.t)}</h3><span class="chip">v${r.ver}</span></div><p>${e(r.desc)}</p><p>${chips([r.type,r.course,...(r.tags||[])])}</p><p class="m">${e(r.by)}${r.uni?", "+e(r.uni):""}, ${r.date}</p><div class="row"><button class="btn sm" data-a="use" data-i="${r.id}">Useful (${r.use})</button><button class="btn sm ghost" data-a="ver" data-i="${r.id}">Upload new version</button><button class="btn sm ghost" data-a="rep" data-k="res" data-i="${r.id}">Report</button></div></div>`).join("")||"<p class=m>No resources match. Upload the first one.</p>"},
iss:()=>{const q=S.q.toLowerCase();return `<div class="grid">${S.iss.filter(i=>!i.hid&&(!S.fu||i.uni==S.fu||i.uni=="Cross-campus")&&(i.t+i.aff).toLowerCase().includes(q)).map(i=>`<div class="card"><span class="chip w">${i.st}</span><h3>${e(i.t)}</h3><p class="m">${e(i.uni)}. Affects: ${e(i.aff)}</p><p class="m">${i.pr.length} proposals, ${i.grp} in working group</p><button class="btn sm" data-a="go" data-v="iss" data-i="${i.id}">Open</button></div>`).join("")||"<p class=m>No issues match.</p>"}</div>`},
ev:()=>{const q=S.q.toLowerCase();return `<div class="grid">${S.ev.filter(x=>!x.hid&&(!S.ft||x.cat==S.ft)&&(!S.fu||x.uni==S.fu)&&(x.t+x.desc).toLowerCase().includes(q)).map(x=>`<div class="card"><span class="chip ${x.cat=="Competition"?"w":""}">${x.cat}</span><h3>${e(x.t)}</h3><p class="m">${e(x.d)}, ${e(x.uni)}</p><p class="m">${x.n} going</p><button class="btn sm" data-a="go" data-v="ev" data-i="${x.id}">View and plan</button></div>`).join("")||"<p class=m>No events match.</p>"}</div>`}};
function cd(){const c=find("corr",S.id);if(!c)return back("corr")+"<p>Not found.</p>";return back("corr")+`<h2>${e(c.name)}</h2><p>${e(c.desc)}</p><p>${chips(c.unis)}</p>
<div class="card"><div class="split"><h3>Study circles and reading groups</h3><button class="btn sm ghost" data-a="newCirc">Start a circle</button></div>${c.circ.map(x=>`<div class="row th"><div style="flex:1"><b>${e(x.t)}</b><div class="m">${e(x.w)}, ${x.n} joined</div></div><button class="btn sm ${x.j?"ghost":""}" data-a="circ" data-i="${x.id}">${x.j?"Leave":"Join"}</button></div>`).join("")||"<p class=m>No circles yet. Start one.</p>"}</div>
<div class="split"><h3>Discussions</h3><button class="btn sm" data-a="newTh">New topic</button></div>`+c.th.filter(t=>!t.hid).map(t=>`<div class="card"><h3>${e(t.t)}</h3><p>${chips([t.tag])}<span class="m">${e(t.by)}${t.u?", "+e(t.u):""}</span></p>${t.r.map(r=>`<div class="rep"><p>${e(r.x)}</p><p class="m">${e(r.by)}${r.u?", "+e(r.u):""}</p></div>`).join("")}<div class="row"><button class="btn sm" data-a="reply" data-i="${t.id}">Reply</button><button class="btn sm ghost" data-a="rep" data-k="th" data-i="${t.id}">Report</button></div></div>`).join("")}
function id_(){const i=find("iss",S.id);if(!i)return back("iss")+"<p>Not found.</p>";return back("iss")+`<div class="split"><div><h2>${e(i.t)}</h2><p class="m">${e(i.uni)}. Affects: ${e(i.aff)}</p></div><span class="chip w">${i.st}</span></div>
<div class="card"><div class="split"><h3>Evidence</h3><button class="btn sm ghost" data-a="addEv">Add</button></div>${i.ev.map(x=>`<p><span class="chip ${x.k=="verified"?"v":""}">${KN[x.k]}</span>${e(x.x)}</p>`).join("")}</div>
<div class="card"><div class="split"><h3>Proposals</h3><button class="btn sm" data-a="addPr">Draft proposal</button></div>${i.pr.map(p=>`<div class="th"><b>${e(p.t)}</b><p class="m">Advantages: ${e(p.pro)}<br>Limitations: ${e(p.con)}</p><button class="btn sm ghost" data-a="vote" data-i="${p.id}">Support (${p.v})</button></div>`).join("")||"<p class=m>No proposals yet. Use the template to suggest a feasible response.</p>"}</div>
